<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BERGER BUCKET VISION</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f1f3f6;

    color: #172033;
}

.container {

    width: 100%;

    max-width: 850px;

    margin: auto;

    padding: 15px;
}

.card {

    background: white;

    border-radius: 18px;

    padding: 20px;

    margin-bottom: 18px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);
}

h2 {

    margin-top: 0;

    font-size: 23px;
}

label {

    display: block;

    font-weight: bold;

    margin-bottom: 10px;
}

select {

    width: 100%;

    padding: 15px;

    font-size: 17px;

    border-radius: 10px;

    border: 1px solid #bbb;

    background: white;
}

button {

    width: 49%;

    padding: 15px 10px;

    border: none;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

#startButton {

    background: #1976d2;

    color: white;
}

#stopButton {

    background: #e1e4e9;

    color: #263246;
}

.camera-area {

    margin-top: 15px;

    width: 100%;

    overflow: hidden;

    border-radius: 15px;

    background: black;
}

video {

    width: 100%;

    display: block;

    max-height: 600px;

    object-fit: cover;
}

#cameraMessage {

    text-align: center;

    margin-top: 10px;

    color: #657083;

    font-size: 16px;
}

.decision {

    width: 100%;

    padding: 28px 10px;

    border-radius: 15px;

    text-align: center;

    font-size: 32px;

    font-weight: bold;
}

.waiting {

    background: #edf0f3;

    color: #536176;
}

.correct {

    background: #dff5e4;

    color: #16803a;
}

.rejected {

    background: #fde3e3;

    color: #b42318;
}

.stats {

    display: flex;

    gap: 10px;

    margin-top: 15px;
}

.stat {

    flex: 1;

    background: #f6f7f9;

    border-radius: 12px;

    padding: 15px 5px;

    text-align: center;
}

.stat-value {

    font-size: 23px;

    font-weight: bold;
}

.stat-label {

    font-size: 12px;

    color: #687386;

    margin-top: 5px;
}

@media(max-width:600px) {

    .container {

        padding: 10px;
    }

    .card {

        padding: 15px;
    }

    button {

        font-size: 14px;
    }

    .decision {

        font-size: 28px;
    }
}

</style>

</head>


<body>

<div class="container">


<!-- =====================================================
     EXPECTED BUCKET
====================================================== -->

<div class="card">

<h2>1. Select Expected Bucket</h2>

<select id="expectedBucket">

{% for item in references %}

<option value="{{ item.filename }}">
    {{ item.label }}
</option>

{% endfor %}

</select>

</div>


<!-- =====================================================
     CAMERA
====================================================== -->

<div class="card">

<h2>2. Camera Inspection</h2>

<div>

<button
    id="startButton"
    onclick="startCamera()"
>
    START REAR CAMERA
</button>

<button
    id="stopButton"
    onclick="stopCamera()"
>
    STOP CAMERA
</button>

</div>


<div class="camera-area">

<video
    id="video"
    autoplay
    playsinline
    muted
>
</video>

</div>


<div id="cameraMessage">

Camera stopped

</div>

</div>


<!-- =====================================================
     DECISION
====================================================== -->

<div class="card">

<h2>3. Vision Decision</h2>

<div
    id="decision"
    class="decision waiting"
>
    WAITING
</div>


<div class="stats">


<div class="stat">

<div
    id="score"
    class="stat-value"
>
    —
</div>

<div class="stat-label">
    MATCH SCORE
</div>

</div>


<div class="stat">

<div
    id="matches"
    class="stat-value"
>
    —
</div>

<div class="stat-label">
    GOOD MATCHES
</div>

</div>


<div class="stat">

<div
    id="inliers"
    class="stat-value"
>
    —
</div>

<div class="stat-label">
    INLIERS
</div>

</div>


</div>

</div>

</div>


<!-- =====================================================
     HIDDEN CANVAS
====================================================== -->

<canvas
    id="canvas"
    style="display:none;"
></canvas>


<script>

let video =
    document.getElementById("video");

let canvas =
    document.getElementById("canvas");

let stream = null;

let checking = false;

let timer = null;


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }
                },

                audio: false

            });

        video.srcObject = stream;

        document.getElementById(
            "cameraMessage"
        ).innerText =
            "Camera active";

        startInspection();

    }

    catch(error) {

        console.error(error);

        document.getElementById(
            "cameraMessage"
        ).innerText =
            "Camera access failed: "
            + error.message;
    }
}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;
    }

    if (timer) {

        clearInterval(timer);

        timer = null;
    }

    checking = false;

    video.srcObject = null;

    document.getElementById(
        "cameraMessage"
    ).innerText =
        "Camera stopped";

    setWaiting();
}


/* =====================================================
   START INSPECTION
===================================================== */

function startInspection() {

    if (timer) {

        clearInterval(timer);
    }

    timer = setInterval(
        captureAndCheck,
        1200
    );
}


/* =====================================================
   CAPTURE CAMERA IMAGE
===================================================== */

async function captureAndCheck() {

    if (!stream) {
        return;
    }

    if (checking) {
        return;
    }

    if (
        video.videoWidth === 0 ||
        video.videoHeight === 0
    ) {

        return;
    }

    checking = true;

    try {

        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;

        let context =
            canvas.getContext("2d");

        context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
         * IMPORTANT:
         *
         * Convert canvas directly
         * into a JPEG Blob.
         *
         * We are NOT using Base64.
         */

        const blob =
            await new Promise(
                resolve =>
                    canvas.toBlob(
                        resolve,
                        "image/jpeg",
                        0.80
                    )
            );


        if (!blob) {

            throw new Error(
                "Could not create camera image"
            );
        }


        /* ---------------------------------------------
           Create multipart form
        --------------------------------------------- */

        const formData =
            new FormData();

        formData.append(
            "expected",
            document.getElementById(
                "expectedBucket"
            ).value
        );

        formData.append(
            "frame",
            blob,
            "camera.jpg"
        );


        /* ---------------------------------------------
           Send to Flask
        --------------------------------------------- */

        const response =
            await fetch(
                "/api/check",
                {

                    method: "POST",

                    body: formData

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Server error"
            );
        }


        showResult(data);

    }

    catch(error) {

        console.error(error);

        document.getElementById(
            "cameraMessage"
        ).innerText =
            error.message;
    }

    finally {

        checking = false;
    }
}


/* =====================================================
   SHOW RESULT
===================================================== */

function showResult(data) {

    const decision =
        document.getElementById(
            "decision"
        );

    const expected =
        data.expected || "";

    const actual =
        data.actual || "";


    if (data.match) {

        decision.className =
            "decision correct";

        decision.innerHTML =
            "✓ CORRECT";

        document.getElementById(
            "cameraMessage"
        ).innerText =
            "Bucket matches: "
            + actual;

    }

    else {

        decision.className =
            "decision rejected";

        decision.innerHTML =
            "✕ REJECTED";

        document.getElementById(
            "cameraMessage"
        ).innerText =
            "Expected: "
            + expected
            + " | Detected: "
            + actual;
    }


    document.getElementById(
        "score"
    ).innerText =
        data.score + "%";


    document.getElementById(
        "matches"
    ).innerText =
        data.good_matches;


    document.getElementById(
        "inliers"
    ).innerText =
        data.inliers;
}


/* =====================================================
   WAITING
===================================================== */

function setWaiting() {

    const decision =
        document.getElementById(
            "decision"
        );

    decision.className =
        "decision waiting";

    decision.innerHTML =
        "WAITING";

    document.getElementById(
        "score"
    ).innerText = "—";

    document.getElementById(
        "matches"
    ).innerText = "—";

    document.getElementById(
        "inliers"
    ).innerText = "—";
}


/* =====================================================
   STOP CAMERA WHEN PAGE CLOSES
===================================================== */

window.addEventListener(
    "beforeunload",
    stopCamera
);

</script>

</body>

</html>
